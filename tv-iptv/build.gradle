// 顶层 Gradle 构建脚本（Android 单模块工程，使用 Kotlin DSL 的 Groovy 写法）
// 注意：本文件定义的是「你自己的 App」依赖，不含任何第三方受保护 SDK（如 ForceTV）
plugins {
    id 'com.android.application'           // Android 应用插件
    id 'org.jetbrains.kotlin.android'     // Kotlin 支持
}

android {
    namespace 'com.yourapp.tvlive'        // 你自己的包名（务必改成你自己的域名反写）
    compileSdk 34                          // 编译 SDK 版本

    defaultConfig {
        applicationId "com.yourapp.tvlive" // 应用唯一 ID
        minSdk 21                          // TV 设备最低 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false            // 先关闭混淆，方便调试；上线前可开启
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // 基础
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // 媒体播放内核：Media3 / ExoPlayer（开源，Apache-2.0，支持 HLS / RTSP / RTMP）
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.0'     // HLS 直播/点播
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.2.0'    // RTSP 摄像头/流
    implementation 'androidx.media3:media3-exoplayer-rtmp:1.2.0'     // RTMP 推流拉流
    implementation 'androidx.media3:media3-ui:1.2.0'                // PlayerView 控件

    // 本地加密存储：腾讯 MMKV（开源，BSD，自行管理密钥）
    implementation 'com.tencent:mmkv:1.3.5'

    // 协程（可选，后续接网络用）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

# ─────────────────────────────────────────────────────────────────────────────
# Gradle 全局配置
# ─────────────────────────────────────────────────────────────────────────────

# 构建进程的 JVM 参数：限制最大堆 2GB，避免默认值过小导致编译 OOM；强制 UTF-8 避免中文注释乱码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 使用 AndroidX（现代 androidx 库体系，必需）
android.useAndroidX=true

# 非传递 R 类：每个模块只生成自己资源的 R 类，加快构建（AGP 8 推荐）
android.nonTransitiveRClass=true

# Kotlin 官方代码风格（仅影响 IDE 提示，不影响编译结果）
kotlin.code.style=official

# 并行构建 + 构建缓存：加快重复构建速度
org.gradle.parallel=true
org.gradle.caching=true
